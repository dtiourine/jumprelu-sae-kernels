[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kernel-jumprelu-sae"
version = "0.1.0"
description = "Triton kernels for JumpReLU Sparse Autoencoders"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "DTiourine" }]
dependencies = [
    "torch>=2.1",
    "triton>=2.1; platform_system != 'Windows'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py310"
