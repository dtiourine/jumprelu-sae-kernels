[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jumprelu-sae-kernels"
version = "0.1.0"
description = "Triton kernels for JumpReLU Sparse Autoencoders"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "DTiourine" }]
dependencies = [
    "torch>=2.1",
    "triton>=2.1; platform_system != 'Windows'",
    "numpy>=1.24",
    "sae-lens>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
